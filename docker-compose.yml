services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financehub}
      POSTGRES_DB: ${POSTGRES_DB:-financehub}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
